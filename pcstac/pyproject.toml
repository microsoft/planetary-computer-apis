[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcstac"
dynamic = ["version"]
description = "Planetary Computer API - STAC."
license = { text = "MIT" }
requires-python = ">=3.7"
dependencies = [
    "idna>=3.7.0",
    "orjson==3.10.4",
    "pypgstac[psycopg]==0.9.6",
    "pystac==1.10.1",
    "stac-fastapi.api==5.0.3",
    "stac-fastapi.extensions==5.0.3",
    "stac-fastapi.pgstac==4.0.4",
    "stac-fastapi.types==5.0.3",
    "typing_extensions>=4.6.1",
    "urllib3>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "types-requests",
]
server = [
    "uvicorn[standard]==0.30.1",
]

[tool.hatch.version]
path = "pcstac/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/pcstac",
]
